services:
  tubeshelf:
    image: tubeshelf
    build: .
    container_name: tubeshelf
    restart: unless-stopped
    ports:
      - "3000:3000"
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    # Optional: fixed secret for encrypting OIDC client secrets. Without it,
    # one is generated in ./data/.secret on first start.
    # environment:
    #   TUBESHELF_SECRET: "replace-with-a-random-32+-char-secret"
    volumes:
      - ./data:/app/data
