{{define "title"}}History · TubeShelf{{end}}
{{define "main"}}
<p class="eyebrow">Library</p>
<h1 class="page-title">History</h1>

<div id="feed" class="videos">{{range .Videos}}{{template "card" (card . $.Set)}}{{end}}</div>

{{end}}
{{end}}
