name: Build DEV container

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional dev tag (default: dev)"
        required: false
        default: dev

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

# A newer dev build fully supersedes an older in-flight one, so it's safe (and
# preferable) to cancel a stale run rather than let it keep building.
concurrency:
  group: dev-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push DEV image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.event.inputs.tag }}
          provenance: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

  # Every dev build pushes a new image under the single, mutable dev tag, so
  # the *previous* build's version becomes untagged (not deleted) the moment
  # a newer one takes the dev tag - those untagged versions otherwise pile up
  # in the GHCR Packages tab forever. Keep just the current build and the one
  # before it.
  #
  # IMPORTANT, learned the hard way: for package-type: container, the
  # GitHub API's version "name" field is the image *digest*
  # (sha256:...), never a tag - so an ignore-versions regex matched
  # against tag-looking strings (dev, latest, v1.2.3) NEVER matches
  # anything for containers and provides no protection at all. The first
  # version of this workflow relied on exactly that regex and, because it
  # was silently a no-op, ended up deleting every version tag in the
  # registry (v1.0.0 through v1.4.0, latest) - purely oldest-by-creation-
  # date, since nothing was actually being excluded from consideration.
  # `delete-only-untagged-versions: true` is the real fix: it filters on
  # metadata.container.tags.length, which the action *does* populate
  # correctly for containers, so anything still carrying any tag - a
  # release, latest, or the current dev - can never be selected no matter
  # how old it is.
  #
  # ghcr.io packages under a personal account (not an org) can't be deleted
  # with the default GITHUB_TOKEN - GitHub requires a personal access token
  # with the delete:packages and read:packages scopes for that. Create one
  # at https://github.com/settings/tokens, add it as a repo secret named
  # GHCR_CLEANUP_TOKEN, and this job will pick it up automatically. Until
  # that secret exists, this job is skipped (not failed) so a normal dev
  # build still succeeds.
  cleanup-old-dev-images:
    needs: build-dev
    runs-on: ubuntu-latest
    steps:
      # Neither a job-level `if:` nor that job's own `env:` can reference
      # `secrets` directly (both are rejected at parse time - GitHub Actions
      # resolves job-level if: before env: is even set up). A step's `run:`
      # script can read secrets fine, though, so check there and gate the
      # next step on this step's *output* instead.
      - name: Check for cleanup token
        id: check-token
        run: |
          if [ -n "${{ secrets.GHCR_CLEANUP_TOKEN }}" ]; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GHCR_CLEANUP_TOKEN secret not set - skipping old dev image cleanup. Create a PAT with delete:packages + read:packages scopes and add it as that repo secret to enable this."
          fi

      # Untagged versions aren't docker-pullable by anyone without already
      # knowing their digest, so there's no reason to keep any of them
      # around - delete-only-untagged-versions scopes deletion to exactly
      # that set, and min-versions-to-keep: 0 means none are kept. Every
      # tagged version (a release, latest, or the current dev build) is
      # never in this set at all, so it's never a candidate no matter how
      # old it is - this is what ignore-versions was meant to guarantee but
      # silently didn't, for the reason explained above.
      - name: Delete untagged image versions
        if: steps.check-token.outputs.has-token == 'true'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true
          token: ${{ secrets.GHCR_CLEANUP_TOKEN }}
