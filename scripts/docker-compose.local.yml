name: tubeshelf-local

services:
  tubeshelf:
    # Image built by ./scripts/build-local.sh (or by `docker compose build`).
    image: tubeshelf:local
    build:
      context: ..
    container_name: tubeshelf
    restart: unless-stopped
    ports:
      - "3000:3000"
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    # Refresh interval, parallel fetches and video retention are set in the
    # app under Admin > Instance settings.
    volumes:
      - ../data:/app/data
